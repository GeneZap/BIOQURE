name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-runtime.txt
      - run: pip install -r backend/requirements-runtime.txt
      - name: Backend unit and HTTP API tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Dump locked responses for report rendering
        run: python backend/scripts/dump_report_fixtures.py report_fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: report-fixtures
          path: report_fixtures

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: report-fixtures
          path: report_fixtures
      - name: Render report tabs against locked backend responses
        run: npm run check:reports
        env:
          REPORT_FIXTURE_DIR: ${{ github.workspace }}/report_fixtures
